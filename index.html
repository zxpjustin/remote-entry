<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>远程工作台入口</title>
<style>
body{margin:0;background:#f2f6f3;color:#18392f;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}main{box-sizing:border-box;width:min(560px,92vw);padding:38px;background:white;border:1px solid #dce7df;border-radius:22px}h1{margin:0 0 12px;font-size:28px}a{display:block;background:#236453;color:white;text-decoration:none;text-align:center;padding:13px;border-radius:10px;margin:24px 0}small{color:#64786b}code{overflow-wrap:anywhere;font-size:12px}button{border:0;background:transparent;color:#236453;text-decoration:underline;cursor:pointer;font:inherit}
</style></head><body><main>
<h1>远程工作台</h1>
<p>请收藏本页。每次家里电脑开启服务后，这里会更新到最新入口。</p>
<a id="enter" href="https://dayton-gtk-biographies-dock.trycloudflare.com" rel="noreferrer">进入工作台 →</a>
<small>入口更新时间：2026-11-12 16:44:56 UTC</small><br><code>https://dayton-gtk-biographies-dock.trycloudflare.com</code>
<p>本页不表示服务当前在线。如果无法进入，请确认家里电脑的服务已开启；刚开启时请稍等发布完成，再刷新本页。</p>
<button id="refresh" type="button">刷新入口</button>
<script>
/** @brief 通过新查询参数重新读取入口，避免使用旧缓存。 */
function refreshEntry(){location.replace(location.pathname+'?refresh='+Date.now());}
document.getElementById('refresh').addEventListener('click',refreshEntry);
/** @brief 点击时重新读取最新入口，读取失败时不跳转到可能已失效的旧地址。 @param event 点击事件。 */
async function enterLatest(event){
  event.preventDefault();
  const link=document.getElementById('enter');
  if(link.dataset.busy)return;
  link.dataset.busy='1';link.textContent='正在获取最新入口…';
  try{
    const response=await fetch(location.pathname+'?latest='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('读取失败');
    const page=new DOMParser().parseFromString(await response.text(),'text/html');
    const target=page.querySelector('#enter')?.getAttribute('href');
    if(!/^https:\/\/[a-z0-9]+(?:-[a-z0-9]+)*\.trycloudflare\.com$/.test(target||''))throw new Error('入口无效');
    location.assign(target);
  }catch(error){link.textContent='无法获取最新入口，请稍后重试';delete link.dataset.busy;}
}
document.getElementById('enter').addEventListener('click',enterLatest);
</script>
<small>登录密码只在进入工作台后输入。聊天内容不经过本页。</small>
</main></body></html>
